<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />

<title>الدخول — لوحة التحكم</title>

</head>
<body>

<main class="login-wrap">
  <form class="login-card" id="login-form" novalidate>
    <div class="login-brand">
      <svg viewBox="0 0 814.414 209.155"><use href="#logo10x10-dark"/></svg>
    </div>
    <h1 class="login-title">لوحة التحكم</h1>
    <p class="login-sub">سجّل دخولك للوصول إلى بيانات التسجيلات</p>

    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="admin@example.com" dir="ltr" style="text-align:right" />
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" dir="ltr" style="text-align:right" />
    </div>

    <button class="btn" type="submit" id="login-btn">دخول</button>
    <div class="form-msg" id="login-msg" role="status" aria-live="polite"></div>
  </form>
</main>

<script type="module" src="./js/login.js"></script>
</body>
</html>
