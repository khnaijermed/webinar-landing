<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>المسجلون — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" />
<link rel="stylesheet" href="./css/dashboard.css" />
</head>
<body>
<main class="main">

  <div class="page-head">
    <div>
      <h1 class="page-title">المسجلون</h1>
      <p class="page-sub">قائمة كاملة بالمسجَّلين في الويبنار من صفحة الهبوط.</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost" id="refresh-btn" type="button">تحديث</button>
      <button class="btn btn-ghost" id="import-csv-btn" type="button">استيراد CSV</button>
      <button class="btn btn-ghost" id="export-btn" type="button">تصدير CSV</button>
      <button class="btn" id="add-member-btn" type="button">+ إضافة عضو</button>
    </div>
  </div>

  <input type="file" id="csv-input" accept=".csv,text/csv" hidden />

  <section class="stats-grid">
    <div class="stat"><div class="stat-label">Total</div><div class="stat-num" id="stat-total">0</div><div class="stat-sub">إجمالي التسجيلات</div></div>
    <div class="stat"><div class="stat-label">Today</div><div class="stat-num" id="stat-today">0</div><div class="stat-sub">تسجيلات اليوم</div></div>
    <div class="stat"><div class="stat-label">7 days</div><div class="stat-num" id="stat-week">0</div><div class="stat-sub">آخر 7 أيام</div></div>
    <div class="stat"><div class="stat-label">Latest</div><div class="stat-num" id="stat-latest" style="font-size:22px">—</div><div class="stat-sub">آخر تسجيل</div></div>
  </section>

  <div class="toolbar">
    <div class="search">
      <input id="search" type="search" placeholder="ابحث بالاسم، البريد، أو الهاتف…" autocomplete="off" />
    </div>
  </div>

  <div class="table-wrap" id="table-wrap">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th data-sort="full_name">الاسم</th>
            <th data-sort="email">البريد</th>
            <th data-sort="phone">الهاتف</th>
            <th data-sort="source">المصدر</th>
            <th data-sort="role">الدور</th>
            <th data-sort="created_at" class="sorted-desc">التاريخ</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty-state" hidden>
      <div class="empty-icon">📭</div>
      <p class="empty-title">لا توجد تسجيلات بعد</p>
      <p class="empty-sub">عندما يسجل أحدهم من صفحة الهبوط، ستظهر بياناته هنا.</p>
    </div>
  </div>

</main>
<script type="module" src="./js/leads.js"></script>
</body>
</html>
