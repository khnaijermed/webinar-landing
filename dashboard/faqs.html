<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>الأسئلة الشائعة — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" />
<link rel="stylesheet" href="./css/dashboard.css" />
</head>
<body>
<main class="main">

  <div class="page-head">
    <div>
      <h1 class="page-title">الأسئلة الشائعة</h1>
      <p class="page-sub">إضافة وتعديل وحذف الأسئلة. اسحب لإعادة الترتيب. فعّل/عطّل أي سؤال.</p>
    </div>
    <div class="page-actions">
      <button class="btn" id="new-faq-btn" type="button">+ سؤال جديد</button>
    </div>
  </div>

  <div class="card">
    <div class="section-list" id="faq-list"></div>
    <div class="empty" id="empty-state" hidden>
      <div class="empty-icon">❓</div>
      <p class="empty-title">لا توجد أسئلة بعد</p>
      <p class="empty-sub">اضغط "+ سؤال جديد" لإضافة أول سؤال.</p>
    </div>
  </div>

</main>
<script type="module" src="./js/faqs.js"></script>
</body>
</html>
