<style>
/* ============================================================
   DESIGN TOKENS — adapted from systemsacademy.ai
   ============================================================ */
:root{
  --bg:#0D0D0D;
  --surface:#141414;
  --surface-2:#1A1A1A;
  --surface-3:#222222;
  --border:#2A2A2A;
  --border-strong:#3a3a3a;

  --text:#E8E8E8;
  --text-2:#AAAAAA;
  --text-3:#888888;
  --text-4:#555555;

  --amber:#F59E0B;
  --amber-2:#FBBF24;
  --amber-hover:#D97706;

  /* logo brand greens (kept for logo + accents) */
  --brand-green:#39b54a;
  --brand-green-2:#5fd170;
  --brand-deep:#08353a;

  --radius-sm:8px;
  --radius:12px;
  --radius-lg:16px;
  --radius-pill:100px;

  --font-display:'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-body:'Inter','Cairo', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --font-arabic:'Cairo','Inter', system-ui, sans-serif;

  --grad-amber:linear-gradient(135deg,#F59E0B,#FBBF24);
  --grad-green:linear-gradient(135deg,#39b54a,#5fd170);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-arabic);
  font-size:17px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}

/* subtle ambient grid */
body::before{
  content:"";
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
  background-size:48px 48px;
  pointer-events:none;
  z-index:0;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 30%,transparent 80%);
}

a{color:inherit;text-decoration:none}
button{font-family:inherit}
img,svg{display:block;max-width:100%}

.container{
  width:100%;
  max-width:1180px;
  margin-inline:auto;
  padding-inline:24px;
  position:relative;
  z-index:1;
}

/* ============================================================
   NAV
   ============================================================ */
.nav{
  position:fixed;top:0;left:0;right:0;
  z-index:50;
  padding:20px 0;
  transition:background-color .25s ease, backdrop-filter .25s ease, border-color .25s ease, padding .25s ease;
  border-bottom:1px solid transparent;
}
.nav.scrolled{padding:14px 0}
.nav.scrolled{
  background:rgba(13,13,13,0.78);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom-color:rgba(255,255,255,0.06);
}
.nav-inner{
  display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:120px;height:auto}
.brand-mark svg{width:100%;height:auto}

.nav-links{display:flex;align-items:center;gap:34px}
.nav-links a{
  font-family:var(--font-arabic);
  font-size:16px;
  font-weight:600;
  letter-spacing:0;
  color:var(--text);
  position:relative;
  padding:6px 2px;
  transition:color .2s ease;
}
.nav-links a::after{
  content:"";position:absolute;
  bottom:0;right:0;left:auto;
  width:0;height:2px;border-radius:2px;
  background:var(--grad-amber);
  transition:width .25s ease;
}
.nav-links a:hover{color:var(--amber)}
.nav-links a:hover::after{width:100%}

.nav-cta{
  font-family:var(--font-arabic);
  font-size:15px;
  font-weight:700;
  letter-spacing:0;
  color:var(--text);
  padding:10px 20px;
  border:1px solid rgba(232,232,232,.32);
  border-radius:var(--radius);
  background:transparent;
  cursor:pointer;
  transition:background-color .2s ease, border-color .2s ease, color .2s ease, transform .15s ease, box-shadow .2s ease;
}
.nav-cta:hover{
  background:var(--amber);
  border-color:var(--amber);
  color:#0D0D0D;
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(245,158,11,.25);
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  font-family:var(--font-arabic);
  font-size:17px;
  font-weight:700;
  letter-spacing:0;
  padding:18px 34px;
  background:var(--amber);
  color:#0D0D0D;
  border:none;
  border-radius:var(--radius);
  cursor:pointer;
  text-decoration:none;
  transition:background-color .2s ease, transform .15s ease, box-shadow .2s ease;
  box-shadow:0 8px 24px rgba(245,158,11,.22);
}
.btn:hover{
  background:var(--amber-hover);
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(245,158,11,.28);
}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.6;cursor:not-allowed;transform:none}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative;
  padding:160px 0 60px;
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:auto;
  top:-15%;left:50%;transform:translateX(-50%);
  width:1100px;height:900px;
  background:radial-gradient(ellipse at center, rgba(245,158,11,.10), rgba(245,158,11,.04) 35%, transparent 70%);
  pointer-events:none;
  z-index:0;
}
.hero::after{
  content:"";position:absolute;
  bottom:-30%;right:-10%;
  width:600px;height:600px;
  background:radial-gradient(circle, rgba(57,181,74,.08), transparent 60%);
  pointer-events:none;
  z-index:0;
}
.hero-inner{position:relative;z-index:1;text-align:center;max-width:880px;margin-inline:auto}

.eyebrow{
  display:inline-flex;align-items:center;gap:12px;
  font-family:var(--font-arabic);
  font-size:17px;
  font-weight:700;
  letter-spacing:0;
  color:#FCD34D;
  padding:11px 22px;
  border:1px solid rgba(245,158,11,.55);
  background:linear-gradient(135deg, rgba(245,158,11,.18), rgba(245,158,11,.08));
  border-radius:var(--radius-pill);
  margin-bottom:30px;
  box-shadow:
    0 0 0 4px rgba(245,158,11,.07),
    0 12px 32px rgba(245,158,11,.18);
  position:relative;
}
.eyebrow::before{
  content:"";position:absolute;inset:-1px;border-radius:var(--radius-pill);
  background:linear-gradient(135deg, rgba(245,158,11,.5), rgba(57,181,74,.35));
  z-index:-1;filter:blur(14px);opacity:.4;
}
.eyebrow .dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--amber);
  box-shadow:0 0 0 5px rgba(245,158,11,.22), 0 0 12px rgba(245,158,11,.7);
  animation:pulseDot 1.6s ease-in-out infinite;
  flex:none;
}
@keyframes pulseDot{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.35);opacity:.6}
}

.h1{
  font-family:var(--font-arabic);
  font-weight:800;
  font-size:clamp(38px,6vw,68px);
  line-height:1.1;
  letter-spacing:-.02em;
  margin:0 0 22px;
  text-wrap:balance;
}
.h1 .grad{
  background:var(--grad-amber);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.h1 .grad-green{
  background:var(--grad-green);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}

.lead{
  font-size:clamp(17px,1.8vw,22px);
  color:var(--text-2);
  max-width:740px;margin:0 auto 18px;
  line-height:1.6;
}
.body-p{
  color:var(--text-3);
  max-width:680px;margin:0 auto 36px;
  font-size:16px;line-height:1.8;
}

.info-row{
  display:flex;flex-wrap:wrap;justify-content:center;gap:12px;
  margin-bottom:0;
}
.info-pill{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--surface);
  border:1px solid var(--border);
  padding:11px 20px;
  border-radius:var(--radius-pill);
  font-size:15px;color:var(--text);
  font-weight:600;
  transition:border-color .2s ease, background .2s ease;
}
.info-pill:hover{border-color:rgba(245,158,11,.35);background:#181818}

/* Line-style icons (Feather-ish) shared by info-pills / cards / audience */
.icon{
  display:inline-block;
  width:1em;height:1em;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex:none;
  vertical-align:middle;
}
.info-pill .icon{width:18px;height:18px;color:var(--amber)}
.card .ico .icon{width:26px;height:26px;color:var(--amber);stroke-width:1.7}
.aud  .ico .icon{width:28px;height:28px;color:var(--brand-green-2);stroke-width:1.6}

/* ============================================================
   VIDEO
   ============================================================ */
.video-wrap{
  padding:24px 0 30px;
  position:relative;
}
.video-card{
  max-width:960px;margin-inline:auto;
  background:linear-gradient(135deg, rgba(245,158,11,.18), rgba(57,181,74,.18));
  padding:1px;
  border-radius:20px;
  position:relative;
}
.video-card::after{
  content:"";position:absolute;inset:-2px;border-radius:22px;
  background:linear-gradient(135deg, rgba(245,158,11,.4), rgba(57,181,74,.4));
  filter:blur(24px);opacity:.35;z-index:-1;
}
.video-frame{
  background:#000;
  border-radius:19px;
  overflow:hidden;
  position:relative;
  aspect-ratio:16/9;
}
.video-frame iframe,
.video-frame video{
  position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;
}

/* Primary CTA standalone (under video) */
.cta-wrap{padding:10px 0 50px;text-align:center;position:relative;z-index:1}

/* Intro under CTA */
.intro-wrap{padding:10px 0 50px;position:relative}
.intro-wrap .hero-inner{padding:0}

/* ============================================================
   STATS
   ============================================================ */
.stats{padding:40px 0 80px}
.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}
.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:28px 22px;
  text-align:center;
  position:relative;
  overflow:hidden;
  transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.stat::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%, rgba(245,158,11,.08), transparent 60%);
  opacity:0;transition:opacity .3s ease;
}
.stat:hover{
  transform:translateY(-4px);
  border-color:rgba(245,158,11,.35);
  box-shadow:0 12px 32px rgba(0,0,0,.4), 0 0 40px rgba(245,158,11,.06);
}
.stat:hover::before{opacity:1}
.stat-num{
  font-family:var(--font-display);
  font-size:44px;font-weight:700;
  background:var(--grad-amber);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  line-height:1;
  letter-spacing:-.02em;
  position:relative;
}
.stat-label{
  margin-top:10px;
  font-size:14px;color:var(--text-2);
  position:relative;
}

/* ============================================================
   SECTION SCAFFOLD
   ============================================================ */
.section{padding:90px 0;position:relative}
.section-head{text-align:center;max-width:760px;margin:0 auto 56px}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-arabic);
  font-size:13.5px;font-weight:700;
  letter-spacing:0;
  color:#FCD34D;
  margin-bottom:16px;
  padding:8px 16px;
  border:1px solid rgba(245,158,11,.32);
  border-radius:var(--radius-pill);
  background:rgba(245,158,11,.07);
}
.h2{
  font-family:var(--font-arabic);
  font-weight:800;
  font-size:clamp(28px,3.6vw,44px);
  line-height:1.2;
  letter-spacing:-.015em;
  margin:0 0 18px;
  text-wrap:balance;
}
.section-sub{
  color:var(--text-2);
  font-size:17px;line-height:1.75;
  max-width:640px;margin:0 auto;
}

.divider{
  height:1px;max-width:560px;margin:0 auto;
  background:linear-gradient(90deg,transparent,rgba(245,158,11,.35),transparent);
}

/* ============================================================
   FEATURE / CARD GRID
   ============================================================ */
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:28px 26px;
  position:relative;
  overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.7,.2,1), border-color .3s ease, box-shadow .3s ease;
}
.card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% -20%, rgba(245,158,11,.08), transparent 60%);
  opacity:0;transition:opacity .3s ease;
  pointer-events:none;
}
.card:hover{
  transform:translateY(-6px);
  border-color:rgba(245,158,11,.45);
  box-shadow:0 18px 40px rgba(0,0,0,.45), 0 0 60px rgba(245,158,11,.08);
}
.card:hover::before{opacity:1}
.card .ico{
  width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.04));
  border:1px solid rgba(245,158,11,.32);
  border-radius:14px;
  margin-bottom:20px;
  color:var(--amber);
  transition:transform .3s ease, box-shadow .3s ease;
}
.card:hover .ico{
  transform:scale(1.06) rotate(-3deg);
  box-shadow:0 8px 24px rgba(245,158,11,.18);
}
.card h3{
  font-family:var(--font-arabic);
  font-weight:700;font-size:18px;
  margin:0 0 8px;line-height:1.3;
}
.card p{margin:0;color:var(--text-2);font-size:15.5px;line-height:1.7}

/* program day cards */
.days{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}
.day{
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:30px;
  position:relative;
  overflow:hidden;
  transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease;
}
.day::before{
  content:"";position:absolute;
  top:-40px;right:-40px;width:200px;height:200px;
  background:radial-gradient(circle, rgba(245,158,11,.1), transparent 70%);
  opacity:0;transition:opacity .3s ease;
}
.day:hover{
  transform:translateY(-4px);
  border-color:rgba(245,158,11,.4);
  box-shadow:0 18px 40px rgba(0,0,0,.4);
}
.day:hover::before{opacity:1}
.day .num{
  font-family:var(--font-display);
  font-size:14px;font-weight:700;
  color:var(--amber);
  letter-spacing:.08em;
  margin-bottom:12px;
  display:inline-flex;align-items:center;gap:8px;
}
.day .num::before{
  content:"";width:24px;height:1px;background:var(--amber);opacity:.6;
}
.day h3{
  font-family:var(--font-arabic);
  font-weight:700;
  font-size:22px;
  margin:0 0 10px;
  line-height:1.3;
}
.day p{margin:0;color:var(--text-2);font-size:15.5px;line-height:1.7}

/* audience cards (smaller) */
.audience{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}
.aud{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:24px 20px;
  text-align:center;
  transition:transform .3s ease, border-color .3s ease, background .3s ease;
}
.aud:hover{
  transform:translateY(-4px);
  border-color:rgba(57,181,74,.4);
  background:linear-gradient(180deg, rgba(57,181,74,.05), transparent);
  box-shadow:0 14px 30px rgba(0,0,0,.35), 0 0 36px rgba(57,181,74,.06);
}
.aud .ico{
  width:54px;height:54px;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg, rgba(57,181,74,.16), rgba(57,181,74,.04));
  border:1px solid rgba(57,181,74,.32);
  border-radius:14px;
  color:var(--brand-green-2);
  transition:transform .3s ease;
}
.aud:hover .ico{transform:scale(1.06)}
.aud p{margin:0;color:var(--text);font-size:14.5px;line-height:1.6;font-weight:500}

/* callout */
.callout{
  background:linear-gradient(135deg, rgba(245,158,11,.06), rgba(57,181,74,.05));
  border:1px solid rgba(245,158,11,.22);
  border-radius:var(--radius-lg);
  padding:48px 36px;
  text-align:center;
  position:relative;overflow:hidden;
}
.callout::before{
  content:"";position:absolute;
  top:-50%;left:50%;transform:translateX(-50%);
  width:600px;height:600px;
  background:radial-gradient(circle, rgba(245,158,11,.08), transparent 60%);
  pointer-events:none;
}
.callout h3{
  font-family:var(--font-arabic);
  font-weight:800;
  font-size:clamp(22px,2.6vw,32px);
  margin:0 0 14px;
  position:relative;
}
.callout p{color:var(--text-2);max-width:680px;margin:0 auto 0;position:relative}

/* ============================================================
   FORM
   ============================================================ */
.form-section{
  padding:90px 0 110px;
  position:relative;
}
.form-card{
  max-width:560px;margin-inline:auto;
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--border);
  border-radius:20px;
  padding:44px 40px;
  position:relative;
}
.form-card::before{
  content:"";position:absolute;inset:-1px;border-radius:21px;
  background:linear-gradient(135deg, rgba(245,158,11,.5), rgba(57,181,74,.4));
  z-index:-1;opacity:.18;filter:blur(20px);
}
.form-card h3{
  font-family:var(--font-arabic);font-weight:800;
  font-size:28px;margin:0 0 8px;text-align:center;
}
.form-card .help{
  text-align:center;color:var(--text-2);font-size:15px;margin:0 0 28px;
}
.field{margin-bottom:14px}
.field label{
  display:block;
  font-family:var(--font-display);
  font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-3);
  margin-bottom:8px;
}
.field input,
.field textarea{
  width:100%;
  font-family:var(--font-arabic);
  font-size:16px;
  padding:16px 18px;
  background:#101010;
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
.field input::placeholder,
.field textarea::placeholder{color:var(--text-4)}
.field input:focus,
.field textarea:focus{
  outline:none;
  border-color:var(--amber);
  background:#121212;
  box-shadow:0 0 0 4px rgba(245,158,11,.15);
}
.form-card .btn{width:100%;margin-top:8px}
.form-msg{
  margin-top:14px;font-size:14px;text-align:center;min-height:20px;
  transition:color .2s ease;
}
.form-msg.error{color:#F87171}
.form-msg.success{color:var(--brand-green-2)}

/* ============================================================
   FOOTER
   ============================================================ */
.footer{
  padding:40px 0 60px;
  border-top:1px solid var(--border);
  text-align:center;
}
.footer-brand{display:flex;justify-content:center;margin-bottom:16px}
.footer-brand svg{width:120px;height:auto;opacity:.85}
.footer p{color:var(--text-3);font-size:13.5px;margin:0}

/* ============================================================
   REVEAL ANIMATIONS
   ============================================================ */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.reveal.delay-1{transition-delay:.08s}
.reveal.delay-2{transition-delay:.16s}
.reveal.delay-3{transition-delay:.24s}
.reveal.delay-4{transition-delay:.32s}

/* ============================================================
   FAQ
   ============================================================ */
.faq-list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:0 22px;transition:border-color .2s ease}
.faq-item[open]{border-color:rgba(245,158,11,.35)}
.faq-item summary{cursor:pointer;font-weight:700;font-size:16px;padding:18px 0;list-style:none;position:relative;padding-inline-end:32px;color:var(--text)}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:"+";position:absolute;inset-inline-end:0;top:50%;transform:translateY(-50%);font-size:22px;color:var(--amber);transition:transform .2s ease;line-height:1}
.faq-item[open] summary::after{content:"−"}
.faq-answer{padding:0 0 18px;color:var(--text-2);line-height:1.8;font-size:15px}

/* FAQ Modal (floating popup) */
.faq-modal-backdrop{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;pointer-events:none;
  transition:opacity .2s ease;
}
.faq-modal-backdrop.open{opacity:1;pointer-events:auto}
.faq-modal{
  width:100%;max-width:720px;max-height:calc(100vh - 80px);
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:28px 28px 24px;
  overflow-y:auto;
  transform:scale(.96);
  transition:transform .2s ease;
}
.faq-modal-backdrop.open .faq-modal{transform:scale(1)}
.faq-modal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;gap:12px;
}
.faq-modal-title{font-family:var(--font-arabic);font-weight:800;font-size:22px;margin:0}
.faq-modal-close{
  background:transparent;border:none;color:var(--text-2);
  font-size:26px;line-height:1;padding:6px 10px;
  cursor:pointer;border-radius:var(--radius-sm);
}
.faq-modal-close:hover{color:var(--text);background:rgba(255,255,255,.05)}

/* ============================================================
   FLOATING / STICKY ELEMENTS
   ============================================================ */
/* Floating action buttons — FAQ (left) + WhatsApp (right), same bottom level */
.faq-fab,
.wa-fab{
  position:fixed;bottom:96px;z-index:55;
  width:64px;height:64px;border-radius:50%;
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  cursor:pointer;text-decoration:none;
  border:1px solid transparent;
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
}
.faq-fab{
  /* FAQ on the visual LEFT */
  left:22px;
  padding:0;
  appearance:none;-webkit-appearance:none;
  border-color:rgba(245,158,11,.45);
  color:var(--amber-2);
  box-shadow:0 8px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(245,158,11,.08);
}
.wa-fab{
  /* WhatsApp on the visual RIGHT */
  right:22px;
  border-color:rgba(57,181,74,.5);
  color:#5fd170;
  box-shadow:0 8px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(57,181,74,.08);
}
.faq-fab svg{width:30px;height:30px;display:block;stroke:currentColor;fill:none}
.wa-fab svg{width:32px;height:32px;display:block}
.faq-fab:hover{
  transform:scale(1.06);
  background:rgba(245,158,11,.08);
  box-shadow:0 12px 32px rgba(245,158,11,.25);
}
.wa-fab:hover{
  transform:scale(1.06);
  background:rgba(57,181,74,.08);
  box-shadow:0 12px 32px rgba(57,181,74,.25);
}

.sticky-cta{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(13,13,13,0), rgba(13,13,13,.94) 30%);
  display:flex;justify-content:center;
  pointer-events:none;
  transform:translateY(100%);
  transition:transform .25s ease;
}
.sticky-cta.in{transform:none}
.sticky-cta .btn{
  pointer-events:auto;
  padding:14px 28px;font-size:15px;
  box-shadow:0 12px 32px rgba(245,158,11,.32);
  min-width:240px;
}

body.has-sticky-cta{padding-bottom:90px}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 960px){
  .nav-links{display:none}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:repeat(2,1fr)}
  .days{grid-template-columns:1fr}
  .audience{grid-template-columns:repeat(2,1fr)}
  .hero{padding:130px 0 40px}
  .section{padding:70px 0}
  .form-card{padding:34px 26px}
}
@media (max-width: 560px){
  .cards{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .stat{padding:22px 16px}
  .stat-num{font-size:36px}
  .h1{font-size:38px}
  .info-pill{font-size:13px;padding:8px 14px}
  .brand-mark{width:96px}
  .nav-cta{display:none}
  .container{padding-inline:18px}
  .callout{padding:36px 22px}
  .faq-fab,
  .wa-fab{bottom:84px;width:58px;height:58px}
  .faq-fab{left:16px}
  .wa-fab {right:16px}
  .faq-fab svg{width:26px;height:26px}
  .wa-fab svg{width:28px;height:28px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .reveal{opacity:1;transform:none}
}

/* Initial loading state */
.cms-loading{
  text-align:center;padding:200px 24px 100px;
  color:var(--text-3);font-family:var(--font-display);
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;
}
</style>
</head>
